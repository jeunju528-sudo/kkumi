name: CI

# PR마다 훅과 같은 검사 재실행 (훅은 --no-verify로 우회 가능)
# 필수 체크 이름: backend, frontend (브랜치 보호 규칙에 등록)
on:
  pull_request:
    branches: [main]

# 같은 PR에 새 커밋 오면 이전 실행 취소
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      # ArchUnit 포함. H2 MySQL 모드라 DB 불필요
      - name: 테스트
        run: ./gradlew test

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 린트
        run: npm run lint

      # tsc -b 포함
      - name: 빌드
        run: npm run build
