name: CI

# PR마다 훅과 같은 검사 재실행 (훅은 --no-verify로 우회 가능)
# 필수 체크 이름: backend, frontend (브랜치 보호 규칙에 등록)
# docker: 이미지 빌드 검증용 (배포 전에 Dockerfile·nginx 설정 깨졌는지 확인)
on:
  pull_request:
    # main으로 합치려는 PR이 열리거나, 그 PR에 새 커밋이 push 될 때 실행
    branches: [main]

# 같은 PR에 새 커밋 오면 이전 실행 취소
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 이 워크플로가 github에서 할 수 있는 권한 설정
permissions:
  contents: read # 코드 읽기만 가능

# 할 일 묶음
jobs:
  backend:
    name: backend # 브랜치 보호 규칙에 등록한 필수 체크 이름, 바꾸면 보호 규칙 다시 등록해야 함
    runs-on: ubuntu-latest # github이 매번 새 리눅스 VM을 빌려줌
    timeout-minutes: 15 # 15분 넘으면 강제 종료
    defaults:
      run:
        working-directory: backend # 아래 명령들은 전부 backend 폴더에서 실행하라고 설정
    steps:
      # uses : 남이 만든 액션(재사용)을 씀
      - uses: actions/checkout@v7 # checkout : 레파지토리 코드를 VM에 다운로드 받음(PR브랜치+현재 main 합친 결과)

      - uses: actions/setup-java@v6 # VM에 java21 설치
        with: # 액션에 넘기는 옵션 작성
          distribution: temurin
          java-version: "21"

      # 캐시는 VM이 아니라 Github의 캐시 저장소(레포마다 따로 있는 보관함)에 저장됨
      # 잡이 끝날 때 setup-gradle과 setup-node가 의존성폴더(~/.gradle, npm캐시)를 압축해서 github보관함에 올림
      # 이 때 이름표(키)를 붙이는데 키는 package-lock.json 이나 gradle설정 파일내용으로 만든 해시값
      # 다음 실행 때 새 VM이 시작되면 같은 키의 압축파일을 내려받아 풀고
      # 파일내용이 바뀌면 키가 달라져서 새로 받고 다시 올림
      - uses: gradle/actions/setup-gradle@v6 # Gradle 준비와 캐시

      # ArchUnit 포함. H2 MySQL 모드라 DB 불필요
      - name: 테스트
        run: ./gradlew test # 실제 검사 실행

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7 # Node 22 설치
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json # package-lock.json 내용이 같으면 npm 캐시 재사용

      - name: 의존성 설치
        run: npm ci # package-lock.json에 적힌 버전 그대로 node_modules를 지우고 새로 설치

      # ESLint 레이어 규칙
      - name: 린트
        run: npm run lint

      # tsc -b(타입검사) + Vite 빌드
      - name: 빌드
        run: npm run build

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 배포에 쓸 이미지가 실제로 만들어지는지 미리 확인, 이미지를 올리지는 않음
    steps:
      - uses: actions/checkout@v7

      - name: backend 이미지 빌드
        run: docker build -t kkumi-backend:ci backend

      - name: nginx 이미지 빌드
        run: docker build -t kkumi-nginx:ci frontend

      # 변수 proxy_pass라 backend 컨테이너 없이도 문법 검사 가능
      - name: nginx 설정 문법 검사
        run: docker run --rm kkumi-nginx:ci nginx -t
