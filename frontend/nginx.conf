# nginx 내부적으로 쓰는 conf 파일 형식

# WebSocket 업그레이드 헤더
# 요청에 Upgrade 헤더가 있으면 upgrade, 없으면 close로 값을 정해둠
# map A B : A 값을 보고 B라는 변수를 만들어 달라는 지시어
# $http_upgrade : nginx 가 Upgrade 요청 헤더를 자동으로 담아두는 변수 http_헤더이름소문자
map $http_upgrade $connection_upgrade {
    default upgrade; # 기본값
    ''      close;   # 값이 비었으면 close 라는 값
}

server {
    listen 80; # 80 번 포트로 들어오는 모든 요청을 받음 
    server_name _; # _ 는 도메인 이름이 뭐든 요청을 받겠다는 뜻이라 ip로 접속이 가능하게 함

    root /usr/share/nginx/html; # 화면 파일이 들어있는 폴더
    index index.html; # 주소가 / 면 index.html 파일을 준다는 뜻

    gzip on; # css, js 같은 파일을 압축해서 전송량을 줄임
    gzip_types text/css application/javascript application/json image/svg+xml;

    # backend : docker compose 서비스 이름, docker 내부 dns가 서비스 이름을 컨테이너 ip로 바꿔줌
    # 127.0.0.11 도커가 모든 컨테이너 안에 심어두는 내장 DNS 서버 주소, backend라는 컨테이너 이름을 ip로 바꿔주는 역할을 하는 서버
    # 컨테이너 IP : 서버 안 도커 네트워크에서 컨테이너가 받는 안쪽 주소

    # 도커 내부 DNS + 변수 사용: backend 재시작으로 IP 바뀌어도 502 안 남
    # nginx는 기본적으로 시작할 때 한번만 backend를 ip로 바꿔서 기억함
    # backend가 재기동 되면 안쪽 ip가 바뀌었을 때 502에러가 발생할 수 있어 요청마다 다시 찾아보게 설정함
    resolver 127.0.0.11 valid=10s;
    # set : 변수를 만들고 값을 넣는 지시어
    set $backend http://backend:8080;

    # 해시 파일명이라 장기 캐시, assets 아래에 있는 파일들은 파일명에 해시값이 붙어서 내용이 바뀌면 파일명이 바뀜
    # Vite가 npm run build할 때 파일 내용으로 해시를 계산해서 파일명을 만들어줌
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # /api/ 로 시작하는 요청
    location /api/ {
        proxy_pass $backend; # proxy_pass로 바로 backend로 넘김
        # 밑에 4줄은 backend가 원래 요청을 알 수 있게 header에 붙여주는 거임
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # STOMP WebSocket
    location /ws {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    # 카카오 로그인 (Spring Security가 처리하는 주소)
    location /oauth2/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /login/oauth2/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 배포 확인용 (health만 노출)
    # location = /actuator/health 이렇게 = 을 붙인건 정확히 이 주소에만 해당한다는 것
    location = /actuator/health {
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    # SPA 라우팅
    # 위 규칙에 안걸린 모든 주소의 마지막 처리, 같은 이름의 파일이 있으면 그 파일을 주고 없으면 index.html을 반환함
    location / {
        try_files $uri /index.html;
    }
}
