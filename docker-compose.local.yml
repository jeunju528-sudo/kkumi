# 로컬용 MySQL (운영은 RDS)
# docker compose -f docker-compose.local.yml up -d
services:
  mysql:
    image: mysql:8.4
    container_name: kkumi-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: kkumi
      MYSQL_USER: ${DB_USERNAME:-kkumi}
      MYSQL_PASSWORD: ${DB_PASSWORD:-kkumi}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - kkumi-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  kkumi-mysql-data:
