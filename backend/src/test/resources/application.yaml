# 테스트용 설정 (main application.yaml 대신 로드됨)
# CI에서 MySQL 없이 테스트 돌리려고 H2(MySQL 모드) 사용
spring:
  datasource:
    url: jdbc:h2:mem:kkumi;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: test
            client-secret: test
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            scope: profile_nickname
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

jwt:
  secret: test-secret-test-secret-test-secret-1234
  access-expiration: 1h
  signup-expiration: 10m

# 가상 시세 변동 설정 (main과 같은 값, 테스트 기동용)
virtual-price:
  tick-interval: 5s # 갱신 주기. 하루에 갱신하는 횟수 60초 * 60분 * 24시간 = 86400초 / 5초 = 17280
  market-weight: 0.3 # 주식 가격에서 시장 분위기의 몫, 모든 주식에게 동일 적용
  half-life-days: 0.5 # 반감기 0.5일(12시간)
  jackpot:
    events-per-day: 0.3 # JACKPOT 종목은 급등락이 3일에 1번씩 일어나도록 설정(하루에 0.3회)
    min-size: 0.15 # 급등락 최소 크기는 15%
    max-size: 0.40 # 급등락 최대 크기는 40%
  daily-volatility: # 유형별 하루의 변동성
    STABLE: 0.08
    ROLLER_COASTER: 0.32
    JACKPOT: 0.12

external:
  molit:
    service-key: test
  kis:
    app-key: test
    app-secret: test
