# 비밀값은 환경변수(.env)로 주입
spring:
  application:
    name: kkumi
  profiles:
    default: local
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
        default_batch_fetch_size: 100

  # 카카오 로그인
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post # 토큰 요청 때 시크릿을 본문에 담아 보내기 위해 사용
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            scope: profile_nickname # 카카오에서 닉네임 받아옴
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id # 회원 id를 식별자로 사용

server:
  port: 8080
  forward-headers-strategy: framework # nginx 가 보낸 X-Forwarded-Proto 를 읽게 해줌

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

# JWT (secret은 32자 이상, 환경변수로만 주입)
# 만료 시간은 임시값. 개발자가 결정 후 수정
jwt:
  secret: ${JWT_SECRET}
  access-expiration: 1h
  signup-expiration: 10m

# 외부 API 키
external:
  molit:
    service-key: ${MOLIT_SERVICE_KEY:}
  kis:
    app-key: ${KIS_APP_KEY:}
    app-secret: ${KIS_APP_SECRET:}

---
# local: docker-compose.local.yml MySQL
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:mysql://localhost:3306/kkumi?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:kkumi}
    password: ${DB_PASSWORD:kkumi}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

---
# prod: AWS RDS
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # TODO: 런칭 전 validate 전환 검토
      ddl-auto: update
    show-sql: false
